{% extends "base.html" %}
{% block title %}MCU 小智 · 聊天{% endblock %}
{% block body_class %}chat-page{% endblock %}
{% block content %}
<div class="shell">
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <span class="brand-mark small" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/></svg>
      </span>
      <div class="side-titles">
        <strong>MCU 小智</strong>
        <span>绍兴大学 · 单片机课程</span>
      </div>
    </div>
    <button id="new-conv" class="new-chat" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新对话
    </button>
    <div class="side-label">聊天记录</div>
    <nav id="conv-list" class="conv-list" aria-label="聊天会话列表"></nav>
    <div class="side-foot">
      <a class="side-link" href="{{ url_for('home_page') }}">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/></svg>
        账号设置
      </a>
      <form method="post" action="{{ url_for('logout') }}">
        <button class="side-link logout" type="submit">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h-7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"/><path d="M10 12h10M17 8.5 20.5 12 17 15.5"/></svg>
          退出登录
        </button>
      </form>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <header class="chat-head">
      <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="打开会话列表">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="head-title">
        <span id="conv-title">新对话</span>
        <span class="head-sub">流式回复 · 历史自动保存</span>
      </div>
      <span class="head-badge" title="由扣子智能体提供支持">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
        AI 课程助手
      </span>
    </header>

    <div id="messages" class="messages" aria-live="polite"></div>

    <div class="composer-zone">
      <div id="banner" class="banner" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>
        <span id="banner-text"></span>
        <button id="resend" type="button">重发上一条</button>
      </div>
      <div id="pending" class="pending" hidden></div>
      <form id="composer" class="composer">
        <input id="file-input" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" hidden>
        <button id="attach" class="icon-btn attach-btn" type="button" title="上传图片（JPG/PNG，≤8MB）" aria-label="上传图片">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4.5 17.5 10 12.5l3.5 3 3-2.5 3 3"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="向小智提问，例如：画一个51单片机最小系统板原理图"></textarea>
        <button id="send" class="send-btn" type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6.5 18.5 12 13 17.5"/></svg>
        </button>
      </form>
      <p class="composer-hint">Enter 发送 · Shift+Enter 换行 · 内容由 AI 生成，请注意甄别</p>
    </div>
  </main>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', path='chat.js') }}"></script>
{% endblock %}
