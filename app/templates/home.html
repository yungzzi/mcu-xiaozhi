{% extends "base.html" %}
{% block title %}账号 · MCU 小智{% endblock %}
{% block body_class %}account-page{% endblock %}
{% block content %}
<div class="page-shell narrow">
  <header class="page-head">
    <a class="back-link" href="{{ url_for('chat_page') }}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M11 6.5 5.5 12 11 17.5"/></svg>
      返回聊天
    </a>
    <h1>账号</h1>
  </header>
  <div class="card page-card">
    <div class="account-row">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/></svg>
      </span>
      <div>
        <strong>师生共享账号</strong>
        <p class="muted">当前登录会话的历史与附件独立保存。</p>
      </div>
    </div>
    <hr class="rule">
    <p class="muted">共享密码的轮换由部署管理员在服务器上执行（scripts/rotate_password.py），轮换后所有设备的旧登录都会失效。</p>
    <form method="post" action="{{ url_for('logout') }}" class="account-logout">
      <button type="submit" class="btn-outline">退出登录</button>
    </form>
  </div>
</div>
{% endblock %}
