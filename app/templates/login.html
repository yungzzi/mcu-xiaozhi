{% extends "base.html" %}
{% block title %}登录 · MCU 小智{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<main class="login-shell">
  <div class="login-card">
    <figure class="login-photo">
      <img src="{{ url_for('static', path='login-bg.jpg') }}" alt="MCS-51 单片机实验板与万用表课程实拍">
    </figure>
    <div class="login-body">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 6V3M15 6V3M9 21v-3M15 21v-3M6 9H3M6 15H3M21 9h-3M21 15h-3"/></svg>
        </span>
        <div class="login-titles">
          <h1>MCU 小智</h1>
        </div>
      </div>
      {% if msg %}<p class="login-error" role="alert">{{ msg }}</p>{% endif %}
      <form method="post" action="{{ url_for('login_submit') }}" class="login-form">
        <label class="field">
          <span class="field-label">账号</span>
          <span class="field-box">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/></svg>
            <input name="username" autocomplete="username" placeholder="师生共享账号" required>
          </span>
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <span class="field-box">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
            <input name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          </span>
        </label>
        <label class="remember">
          <input name="remember" type="checkbox">
          <span class="remember-box" aria-hidden="true"></span>
          在此设备上记住登录（15 天）
        </label>
        <button type="submit" class="login-submit">进入课程助手</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
