name: mcu-xiaozhi
services:
  mcu-xiaozhi:
    image: ${MCU_IMAGE:?Set MCU_IMAGE to the versioned image, e.g. mcu-xiaozhi:0.1.0}
    ports:
      - "127.0.0.1:${MCU_PORT:-8090}:8080"
    volumes:
      - type: bind
        source: ${MCU_HOME:-/srv/mcu-xiaozhi}/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${MCU_HOME:-/srv/mcu-xiaozhi}/uploads
        target: /app/uploads
        bind:
          create_host_path: false
    environment:
      MCU_ROOT_PATH: "${MCU_ROOT_PATH:-/mcu-xiaozhi}"
      MCU_SECURE_COOKIES: "${MCU_SECURE_COOKIES:-1}"
      MCU_USERNAME: "${MCU_USERNAME:-mcu}"
      MCU_DATA_DIR: /app/data
      MCU_UPLOAD_DIR: /app/uploads
      COZE_MODE: "${COZE_MODE:-mock}"
      COZE_API_BASE: "${COZE_API_BASE:-https://api.coze.cn}"
      COZE_BOT_ID: "${COZE_BOT_ID:-}"
      COZE_TOKEN_FILE: /run/secrets/coze_token
      MCU_PASSWORD_FILE: /run/secrets/mcu_password
      MCU_MAX_UPLOAD_BYTES: "${MCU_MAX_UPLOAD_BYTES:-8388608}"
    secrets:
      - coze_token
      - mcu_password
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  coze_token:
    file: ${MCU_SECRET_DIR:-./secrets}/coze_token.txt
  mcu_password:
    file: ${MCU_SECRET_DIR:-./secrets}/mcu_password.txt